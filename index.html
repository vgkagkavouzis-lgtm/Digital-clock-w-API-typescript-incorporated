            <button class="btn">12h</button>

                <span id="localOffset"></span>

        </div>

            <p>Search something</p>
        </div>

                <label for="">Find a city  </label>

                        <p id="p-color-box-sleep">Sleep 23-07</p>
                    </div>
                </div>
                <div class="suggestions-box">
                    <!-- <div class="suggestions highlight">sdfsdfsdf</div> -->
                </div>    
            </form> 
            <div id="main-select-input">
                <label for="timeZoneSelect">Or choose a timezone</label>
                <select id="timeZoneSelect" class="">
                    <option value="Choose a time-zone">Choose a time-zone</option>
                </select>
            </div>
        </div>
    </section>

        <section id="time-converter">
            <h3>Time Converter</h3>
            <form action="" id="converter-form">
                <div id="converter-time-from-zone-container">
                    <label for="convertFromTimezone">From</label>
                        <select class="input-converter" id="convertFromTimezone" >
                            <option value="Timezone">Timezone</option>
                        </select>
                </div>
                <div id="converter-date-time-container">
                    <div id="converter-date-container">
                        <label for="convertFromDate">Date</label>
                        <input class="input-converter" id="convertFromDate" type="date" >
                    </div>
                    <div id="converter-date-container">
                        <label for="convertFromTime">Time</label>
                        <input class="input-converter" id="convertFromTime" type="time">
                    </div>
                </div>
                <div id="converter-time-to-zone-container">
                    <label for="convertToTimezone">To</label>
                        <select class="input-converter" id="convertToTimezone" >
                            <option value="Timezone">Timezone</option>
                        </select>
                </div>
            </form>
            <ul class="list" id="convertedList">
                <li>
                    <label for=""></label>
                    <p id="convertedData">
                        <span class='converted-date'>Date</span>
                        <span class='converted-time'>Time</span>
                        <span class="converted-timezone">Timezone</span>
                    </p>
                </li>
            </ul>
        </section>
