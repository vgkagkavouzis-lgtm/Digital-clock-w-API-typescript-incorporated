    <nav class=" flex justify-end items-center gap-4">
        <div id="toggle12hour">
            <button class="btn">12h</button>
        </div>
        <div id="toggleNightMode" class="flex">
            <button id="day-night-toggle" class="flex justify-center items-center rounded-full w-12 h-12 bg-(--location-btn-background)" >
                <img src="./icons/dark_mode_light.svg" class="dark:hidden" alt="dark mode">
                <img src="./icons/light_mode.svg" class="hidden dark:inline" alt="light mode">
            </button>
        </div>

    <section id="header" class="flex flex-row justify-between items-center flex-wrap gap-6 my-4 mr-4 ">
        <div id="title-info" class="flex flex-col">
            <h1>What time is it?</h1>
            <p>A web app to get any time you need!</p>
        </div>  
        <div id="local-time" class="flex flex-col">
            <p>Local time · <span id="localZoneDisplay"></span></p>
            <h6 id="localTimeP">
                <span id="localTime" class="text-[1.2rem]"></span>
                <span id="localPeriod"></span>
                <span id="localOffset"></span>
            </h6>
        </div>
    </section>
    <section id="main-input-select-container">
        <div class="flex flex-col w-(--general-width) h-[5.2rem]">

            <p id="secondary-assistant-display" class="message text-[1rem] mr-4 mb-[0.2rem]" data-message-type='info'></p>
        </div>
        <div class="flex flex-row justify-between items-start flex-wrap relative">
            <form action="" id="main-input-form" class="flex flex-col justify-center">

                <div id="container-working-hours-info" class="flex flex-row gap-4 py-2 w-(--general-width)">
                    <div id="div-working-hours" class="flex flex-row justify-center items-center gap-2">
                        <div id="div-color-box-work" class="w-4 h-4 rounded-(--border-radius) bg-(--yellow-color)"></div>
                        <p id="p-color-box-work">Work 09-17</p>
                    </div>
                    <div id="div-awake-hours" class="flex flex-row justify-center items-center gap-2">
                        <div id="div-color-box-awake" class="w-4 h-4 border-main bg-(--faded-bg-color)  "></div>
                        <p id="p-color-box-awake">Awake</p>
                    </div>
                    <div id="div-sleep-hours" class="flex flex-row justify-center items-center gap-2">
                        <div id="div-color-box-sleep" class="w-4 h-4 rounded-(--border-radius)  bg-(--location-btn-background)"></div>
                        <p id="p-color-box-sleep">Sleep 23-07</p>
                    </div>
                </div>
                <div class="suggestions-box">
                    <!-- <div class="suggestions highlight">sdfsdfsdf</div> -->
                </div>    
            </form> 
            <div id="main-select-input" class="flex flex-col justify-center min-w-86 max-w-(--general-width)">
                <label for="timeZoneSelect">Or choose a timezone</label>
                <select id="timeZoneSelect" class="">
                    <option value="Choose a time-zone">Choose a time-zone</option>
                </select>
            </div>
        </div>
    </section>

        <section id="time-converter" class="flex flex-col border-main p-4 bg-(--whiter-bg-color) h-112 min-w-86 max-w-(--general-width)">
            <h3>Time Converter</h3>
            <form action="" id="converter-form" class="flex flex-col mb-2 gap-2">
                <div id="converter-time-from-zone-container" class="flex flex-col">
                    <label for="convertFromTimezone">From</label>
                        <select class="input-converter" id="convertFromTimezone" >
                            <option value="Timezone">Timezone</option>
                        </select>
                </div>
                <div id="converter-date-time-container" class="flex flex-row gap-13">
                    <div id="converter-date-container" class="flex flex-col">
                        <label for="convertFromDate">Date</label>
                        <input class="input-converter" id="convertFromDate" type="date" >
                    </div>
                    <div id="converter-date-container" class="flex flex-col">
                        <label for="convertFromTime">Time</label>
                        <input class="input-converter" id="convertFromTime" type="time">
                    </div>
                </div>
                <div id="converter-time-to-zone-container" class="flex flex-col">
                    <label for="convertToTimezone">To</label>
                        <select class="input-converter" id="convertToTimezone" >
                            <option value="Timezone">Timezone</option>
                        </select>
                </div>
            </form>
            <ul id="convertedList" class="list py-4 border-t-(length:--border-width) border-(--border-color) rounded-(--border-radius)">
                <li class=" list-none">
                    <label for=""></label>
                    <p id="convertedData" class="flex flex-col">
                        <span class='converted-date text-[1.2rem] text-(--font-color)'>Date</span>
                        <span class='converted-time text-[2.7rem] text-(--font-color)'>Time</span>
                        <span class="converted-timezone text-(--font-color)">Timezone</span>
                    </p>
                </li>
            </ul>
